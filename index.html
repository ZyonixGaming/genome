<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Every Horsey Game gene: helix H and position P, dominance m, scale s, its four bases with values g0-g3, and what each gene does.">
<title>Horsey Game Genome Table - H, P, m, s, bases and effects</title>
<link rel="icon" type="image/x-icon" href="../../shared/ico/dna.ico">
<style>
  /* ------------------------------------------------------------------
     Horsey Game Genome Table - standalone, no dependencies. The gene data is built into the page
     from genes.xml together with each gene's helix and position. Regenerate the DATA block at the
     bottom of this file if genes.xml changes; the value names and the descriptions have their own
     builders and checks under tools/.
     ------------------------------------------------------------------ */
  :root {
    --bg: #0f1720;
    --panel: #16202a;
    --panel2: #1c2836;
    --line: #2d3a46;
    --line2: #223040;
    --text: #dce6f0;
    --dim: #93a4b5;
    --dim2: #6b7c8d;
    --accent: #4fb3ff;
    --accent2: #7ee787;
    --warn: #ffb454;
    --thead-h: 42px;
    --group-h: 26px;
    --helix-w: 46px;
    /* the width cap shared by the header, the table and the legend */
    --table-max: 1680px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  /* The page itself never scrolls: only the table does. The header, the table and the legend are
     three stacked blocks of one fixed-height column, all cut to the same width. */
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 "Segoe UI", Roboto, system-ui, -apple-system, sans-serif;
    max-width: var(--table-max); margin: 0 auto;
    display: flex; flex-direction: column;
  }
  a { color: var(--accent); }

  header.top {
    flex: 0 0 auto; z-index: 40;
    background: linear-gradient(180deg, #1b2836, #131e28);
    border-bottom: 1px solid var(--line);
    border-left: 1px solid var(--line2); border-right: 1px solid var(--line2);
    padding: 10px 16px 12px;
  }
  .title-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
  h1 .dna { margin-right: 6px; }

  .controls { display: flex; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
  .search-wrap { position: relative; flex: 1 1 320px; max-width: 460px; }
  .search-wrap svg { position: absolute; left: 9px; top: 8px; opacity: .5; }
  #search {
    width: 100%; padding: 7px 30px 7px 30px;
    background: #0d151d; border: 1px solid var(--line); border-radius: 6px;
    color: var(--text); font: inherit; font-size: 13.5px;
  }
  #search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(79,179,255,.15); }
  #clearSearch {
    position: absolute; right: 6px; top: 5px; display: none;
    background: none; border: 0; color: var(--dim); font-size: 15px; cursor: pointer; padding: 2px 5px;
  }
  #clearSearch:hover { color: var(--text); }
  .count { color: var(--dim); font-size: 12.5px; white-space: nowrap; }
  .count b { color: var(--text); font-weight: 600; }
  button.btn {
    background: var(--panel2); border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 12.5px; cursor: pointer;
  }
  button.btn:hover { border-color: var(--accent); color: #fff; }

  /* ------------------------------- table ------------------------------- */
  /* The table is the only thing on the page that scrolls, sideways and down. It fills whatever
     height is left between the header and the legend. Column widths are set by dragging a header
     edge (see the resize handler). */
  .table-wrap {
    flex: 1 1 auto; min-height: 0;
    overflow: auto;
    border-left: 1px solid var(--line2); border-right: 1px solid var(--line2);
  }
  table.genes { border-collapse: separate; border-spacing: 0; width: 100%; table-layout: fixed; }
  /* The header padding must match the cells exactly, or a right-aligned number will not sit under
     its header. Neither the header nor a cell has right padding, so the last digit of both lands on
     the column edge and they line up; the resize grip is pinned in that padding-free strip. */
  table.genes thead th {
    position: sticky; top: 0; z-index: 30;
    height: var(--thead-h); background: #1b2836;
    border-bottom: 1px solid var(--line);
    font-size: 12px; font-weight: 600; letter-spacing: .3px;
    color: var(--dim); text-align: right; padding: 0 0 0 8px; white-space: nowrap;
    overflow: hidden;
  }
  table.genes thead th.sortable { cursor: pointer; user-select: none; }
  table.genes thead th.sortable:hover { color: var(--text); }
  table.genes thead th .arrow { color: var(--accent); margin-left: 3px; font-size: 10px; }
  /* the header text sits over its numbers: right for the numbers, left for the two text columns */
  table.genes thead th .th-label { display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  /* the H column is centred in both header and body, so its header needs no left inset either */
  thead th.c-helix { padding: 0; }
  /* The name and description headings align left with their text, inset like it is. The selector has
     to match the weight of `table.genes thead th` above (otherwise its `text-align: right` wins) and
     the label has to fill the cell, or an inline-block would shrink-wrap and sit at the right edge. */
  table.genes thead th.name, table.genes thead th.desc { text-align: left; padding-left: 14px; }
  table.genes thead th.name .th-label, table.genes thead th.desc .th-label { width: 100%; }

  /* drag handle, in the strip that the cells leave empty */
  .col-resize {
    position: absolute; top: 0; right: 0; width: 8px; height: 100%;
    cursor: col-resize; z-index: 5;
  }
  .col-resize:hover, .col-resize.active { background: linear-gradient(90deg, transparent, rgba(79,179,255,.55)); }
  body.col-resizing, body.col-resizing * { cursor: col-resize !important; user-select: none !important; }

  /* sticky helix + position columns */
  .c-helix, .c-pos { position: sticky; z-index: 10; }
  thead .c-helix, thead .c-pos { z-index: 31; }
  .c-helix { left: 0; width: var(--helix-w); text-align: center; color: var(--dim); }
  .c-pos { left: var(--helix-w); text-align: right; color: var(--dim); border-right: 1px solid var(--line2); }

  tbody td { border-bottom: 1px solid var(--line2); padding: 5px 0 5px 8px; vertical-align: top; overflow: hidden; }
  /* Alternating bands, one plain colour each: every row of a helix shares a band. */
  tbody tr.helix-even td { background-color: #131d27; }
  tbody tr.helix-odd td  { background-color: #1a2634; }
  tbody tr:hover td { background-color: #24384c; }
  tbody tr:target td, tbody tr.flash td { background-color: #2b3f2f !important; }
  /* the sticky pair must stay opaque, and get a shade that marks the frozen edge */
  .c-helix, .c-pos { background-color: #131d27; }
  tr.helix-odd .c-helix, tr.helix-odd .c-pos { background-color: #1a2634; }
  tr:hover .c-helix, tr:hover .c-pos { background-color: #24384c; }
  .c-pos::after {
    content: ''; position: absolute; top: 0; right: -6px; bottom: 0; width: 6px;
    background: linear-gradient(90deg, rgba(0,0,0,.5), transparent); pointer-events: none;
  }

  tr.helix-group td {
    position: sticky; top: var(--thead-h); z-index: 20;
    background-color: #202f3d !important; border-top: 1px solid #33475a; border-bottom: 1px solid #33475a;
    padding: 3px 10px; font-size: 11.5px; letter-spacing: .6px; color: #b9c9d8;
  }
  tr.helix-group .g-name { font-weight: 700; color: #dfe9f2; }
  tr.helix-group .g-count { color: var(--dim); margin-left: 8px; font-size: 11px; }

  /* A gap off the P column and off the g3 column, so the two text columns do not touch the numbers */
  td.name { white-space: nowrap; padding-left: 14px; }
  td.name a {
    font-family: Consolas, "Cascadia Mono", ui-monospace, monospace;
    font-size: 12.5px; font-weight: 600; color: #eaf2fa; text-decoration: none;
    border-bottom: 1px dotted #3d5164;
  }
  td.name a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  td.name .gid { color: var(--dim2); font-size: 10.5px; margin-left: 5px; font-family: inherit; }

  td.desc { min-width: 240px; color: #c7d5e2; font-size: 12.5px; padding: 5px 24px 5px 14px; }
  td.m button {
    background: none; border: 1px solid transparent; border-radius: 5px;
    color: var(--accent); font: inherit; font-variant-numeric: tabular-nums;
    cursor: pointer; padding: 1px 6px; font-weight: 600;
  }
  td.m button:hover, td.m button:focus-visible {
    border-color: var(--accent); background: rgba(79,179,255,.12); outline: none;
  }
  /* ---- discrete-value annotations ---- */
  .ann-mark { color: var(--warn); font-size: 10px; margin-left: 2px; cursor: help; }
  .g-lab {
    display: none; font-size: 10.5px; line-height: 1.25; color: #9fd2a8;
    font-weight: 400; margin-top: 1px; white-space: nowrap;
  }
  body.ann-show .g-lab { display: block; }
  body.ann-show td.num { padding-bottom: 6px; }
  /* ---- a g column: its base, the value that base gives, the raw column value ---- */
  .g-cell { cursor: pointer; }
  .g-cell:hover, .g-cell:focus-within { box-shadow: inset 0 0 0 1px var(--accent); }
  .g-base { font-family: Consolas, ui-monospace, monospace; font-weight: 700; font-size: 12px; margin-right: 4px; }
  .g-val { color: #eaf2fa; }
  .g-cell .g-lab { color: #9fd2a8; }
  /* a base effect that comes from the base itself rather than from the blended value */
  .g-cell .g-lab.g-eff { color: var(--warn); font-style: italic; }
  .g-lab i.sw, .chip i.sw {
    display: inline-block; width: 8px; height: 8px; border-radius: 2px;
    margin-right: 4px; vertical-align: baseline; border: 1px solid rgba(255,255,255,.3);
  }
  .ann-note {
    margin: 12px 0 0; padding: 8px 10px; font-size: 12px; color: #d9e6f2;
    background: #17232e; border: 1px solid var(--line2); border-left: 3px solid var(--warn);
    border-radius: 6px;
  }
  .chip.on { border-color: #3f7f4a; background: #1b2c22; }
  /* ---- base colours: A yellow, C blue, G green, T red, everywhere a base is printed ---- */
  .b-A { color: #e3c53d; } .b-C { color: #58a6ff; }
  .b-G { color: #56d364; } .b-T { color: #ff6b6b; }
  .g-val { display: inline-block; min-width: 34px; }

  .no-results { padding: 30px 16px; color: var(--dim); }

  /* A blank strip after the last row, so the final gene is not glued to the edge of the scroll box */
  tbody::after { content: ''; display: block; height: 100px; }

  .legend {
    flex: 0 0 auto; padding: 10px 16px 4px; color: var(--dim); font-size: 12px;
    border-top: 1px solid var(--line2); background: var(--panel);
    border-left: 1px solid var(--line2); border-right: 1px solid var(--line2);
    overflow: auto; max-height: 30vh;
  }
  .legend b { color: var(--text); }
  .legend p { margin: 4px 0; }

  /* ------------------------------- modal ------------------------------- */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(5,9,13,.72);
    display: none; align-items: flex-start; justify-content: center; z-index: 100; padding: 24px 12px 12px;
    overflow: auto;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 18px 50px rgba(0,0,0,.55); width: min(760px, 100%); padding: 0 0 16px;
  }
  .modal-head {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 16px 10px; border-bottom: 1px solid var(--line2);
  }
  .modal-head h2 { margin: 0; font-size: 17px; font-family: Consolas, ui-monospace, monospace; }
  .modal-head .meta { color: var(--dim); font-size: 12px; margin-top: 3px; }
  .modal-head .meta b { color: var(--text); }
  .modal-head .spacer { flex: 1; }
  .modal-body { padding: 14px 16px 0; }
  .modal-desc { color: #c7d5e2; font-size: 13px; margin: 0 0 14px; }
  .modal h3 { font-size: 12.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .8px; margin: 0 0 8px; }
  /* started on its own line, clear of the descriptions and colour grids above it */
  .modal h3.matrix-title { margin: 16px 0 8px; }

  .matrix { border-collapse: separate; border-spacing: 3px; }
  .matrix th {
    font-size: 13px; font-weight: 700; text-align: center; padding: 2px 6px;
    font-family: Consolas, ui-monospace, monospace;
  }
  /* the top-left cell is deliberately empty: the row and column headers carry the axes */
  .matrix th.corner { padding: 0; }
  /* The number and its shading are separate elements: a text-shadow of the cell's own colour would
     smear the digits, and inheriting the cell colour would tint them. A shadow keeps the number
     readable over both the blue and the red end of the ramp. */
  .matrix td {
    min-width: 62px; text-align: center; padding: 7px 6px; border-radius: 6px;
    font-variant-numeric: tabular-nums; font-size: 13.5px; color: #fff;
  }
  .matrix td .mnum { display: block; text-shadow: 0 1px 2px rgba(0,0,0,.75), 0 0 4px rgba(0,0,0,.5); }
  .matrix td small { display: block; font-size: 10px; color: rgba(255,255,255,.8); font-weight: 600;
    text-shadow: 0 1px 2px rgba(0,0,0,.75); }
  /* the word for an effect that comes from the base rather than from the blended value */
  .matrix i.eff { font-style: italic; font-weight: 600; color: var(--warn); }
  .matrix th i.eff { display: block; font-size: 9.5px; color: var(--warn); font-weight: 600; font-style: italic; }
  .matrix td.diag { outline: 1px solid rgba(255,255,255,.55); outline-offset: -1px; font-weight: 700; }
  .matrix td.hit { box-shadow: inset 0 0 0 2px var(--accent); }
  .matrix th.aa-A { color: #e3c53d; } .matrix th.aa-C { color: #58a6ff; }
  .matrix th.aa-G { color: #56d364; } .matrix th.aa-T { color: #ff6b6b; }

  /* ---- colour grids: the genes that only mean something together ---- */
  .cgrid { border-collapse: separate; border-spacing: 2px; margin: 0 0 12px; }
  .cgrid th {
    font-size: 11px; font-weight: 600; color: var(--dim); text-align: center;
    padding: 1px 5px; font-family: Consolas, ui-monospace, monospace;
  }
  .cgrid th.corner { font-size: 10px; color: var(--dim2); font-weight: 400; text-align: right; line-height: 1.15; }
  .cgrid td {
    background: #101a23; border: 1px solid var(--line2); border-radius: 6px;
    padding: 3px 5px; min-width: 84px; vertical-align: middle;
  }
  .cgrid td.hit { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .csw {
    display: inline-block; width: 13px; height: 13px; border-radius: 3px;
    border: 1px solid rgba(255,255,255,.35); vertical-align: middle;
  }
  /* The three coat colours of one cell: a labelled swatch each, with the order in the cell tooltip.
     The letter sits high inside the swatch, on a dark chip, so it reads on light and dark alike. */
  .ctrio { display: flex; gap: 3px; justify-content: center; }
  .ctrio .csw {
    position: relative; width: 22px; height: 26px; border-radius: 3px; overflow: hidden;
    padding: 0; background: none; border: 1px solid rgba(255,255,255,.35);
  }
  .ctrio .csw b { display: block; position: absolute; inset: 0; }
  .ctrio .csw i {
    position: absolute; top: 0; left: 0; z-index: 1; font-style: normal;
    font-size: 8.5px; line-height: 1; text-transform: uppercase; padding: 1px 3px;
    background: rgba(0,0,0,.55); color: #fff; font-family: Consolas, ui-monospace, monospace;
    border-bottom-right-radius: 3px;
  }
  .ctrio .csw:last-child { margin-right: 0; }
  .clab { font-size: 10px; color: var(--dim); margin-left: 5px; font-family: Consolas, ui-monospace, monospace; }
  .clab i { display: block; font-style: normal; color: var(--dim2); font-size: 9px; }
  .clab.cempty { color: var(--dim2); font-style: italic; margin-left: 0; }
  /* a note under a colour grid, saying what the letters and the axis are */
  .grid-key { margin: 2px 0 10px; color: var(--dim); font-size: 12px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .grid-key b { color: var(--text); }
  /* the BASE_CREAM ladder: one row per step, with its own labels on the row head */
  .cgrid.cram th { text-align: left; }
  .cgrid.cram th i { display: block; font-style: normal; color: var(--dim2); font-size: 9px; text-transform: none; }
  .cgrid.cram th.corner { text-align: right; text-transform: none; }
  .cgrid.cram td { min-width: 52px; text-align: center; }
  .grid-note { margin: 0 0 12px; color: var(--dim); font-size: 12px; }
  .m-legend { margin: 12px 0 0; color: var(--dim); font-size: 12px; }
  .m-legend ul { margin: 6px 0 0; padding-left: 18px; }
  .m-legend li { margin: 2px 0; }
  .m-legend code { color: var(--accent2); }
  .m-strip { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 20px;
    padding: 3px 10px; font-size: 12px; font-variant-numeric: tabular-nums;
  }
  .chip b { font-family: Consolas, ui-monospace, monospace; }
  .chip.best { border-color: #3f7f4a; color: #b7f0bd; }
  .chip.worst { border-color: #7f4a3f; color: #f0c7b7; }

  @media (max-width: 700px) {
    /* On a phone the fixed-height column would leave almost no room for the table, so the page
       scrolls as a whole there and the table keeps its own scroll. */
    html, body { height: auto; overflow: auto; }
    body { display: block; }
    .table-wrap { max-height: 70vh; }
    h1 { font-size: 16px; }
    td.desc { min-width: 200px; font-size: 12px; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="title-row">
    <h1><span class="dna">🧬</span>Horsey Game Genome Table</h1>
  </div>
  <div class="controls">
    <div class="search-wrap">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
        <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4.3-4.3"></path>
      </svg>
      <input id="search" type="search" placeholder="Search gene names or descriptions..." autocomplete="off" spellcheck="false" aria-label="Search genes">
      <button id="clearSearch" title="Clear search" aria-label="Clear search">&times;</button>
    </div>
    <span class="count" id="count"></span>
    <span style="flex:1"></span>
    <button class="btn" id="resetBtn" title="Clear the search, the sort and the link in the address bar">Reset</button>
  </div>
</header>

<div class="table-wrap" id="tableWrap">
  <table class="genes" id="geneTable">
    <colgroup id="colGroup"></colgroup>
    <thead>
      <tr id="headRow"></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="legend" id="legend"></div>

<div class="modal-bg" id="modalBg" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div class="modal-head">
      <div>
        <h2 id="modalTitle">GENE</h2>
        <div class="meta" id="modalMeta"></div>
      </div>
      <div class="spacer"></div>
      <button class="btn" id="copyLink">Copy link</button>
      <button class="btn" id="closeModal" aria-label="Close">&times; Esc</button>
    </div>
    <div class="modal-body">
      <p class="modal-desc" id="modalDesc"></p>
      <div id="modalAnn"></div>
      <div id="gridHost"></div>
      <h3 class="matrix-title">Value for every pair of bases</h3>
      <div id="matrixHost"></div>
      <div class="m-legend" id="matrixNote"></div>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   DATA - generated from shared/data/genes.xml. Do not hand-edit; rebuild
   from the XML if the gene table changes.
   genes[i] = { i: gene index (0..239), n: name, h: helix, p: position,
                m: dominance, s: scale, o: base order (n), g: [4] values,
                d: what the gene does, x: index into MAT,
                a: the discrete-value names and the gene's caveat, written by
                   tools/build-gene-table-annotations.py }
   MAT[i]   = 16 values, row-major 4x4, MAT[i][a*4+b] = the gene's value
              when the dominant base is column a and the recessive is b
              (diagonal = both strands the same base).
   ===================================================================== */

/* ---------------------------------------------------------------------
   VALUE ANNOTATIONS
   Some genes are discrete: the blended number is an index or a switch, not a size. `g.a` carries
   what the visual editor (apps/visual/editor-specs.js) and SIMPR call each of those values:
     a.l = { gene value: what it means }   and a.c = the swatch for the colour genes
     a.t = the caveat SIMPR shows with the gene (needs another gene, gets overridden, ...)
   The superscript dot next to a gene name marks a gene that has either.
   --------------------------------------------------------------------- */
const hasAnn = g => !!(g.a && (g.a.l || g.a.t));
/* With the value names on, the letter that marks a gene as discrete gives way to the name itself. */
document.body.classList.add('ann-show');

/* A few genes carry an effect that comes from carrying one particular base rather than from the
   blended value (OSTO_SIZE's rounded spikes want G, CHEST_SMALL's sloped chest wants A). The
   annotation builder puts that in `a.sep`: `cells` maps a gene value to { column: effect } for the
   base's own g cell, `axis` maps a column to the marker shown on the 4x4 grid's row and column, and
   `matrix` is the word a 4x4 cell uses when the pair contains that base. */
function alleleEffect(g, allele) {
  const sep = g.a && g.a.sep;
  if (!sep || !sep.cells) return null;
  const at = sep.cells[gvOf(g, allele)];
  return at ? at[allele] || null : null;
}
function axisEffect(g, allele) {
  const sep = g.a && g.a.sep;
  return sep && sep.axis ? sep.axis[allele] || null : null;
}
function matrixEffectFor(g, alleleA, alleleB) {
  const sep = g.a && g.a.sep;
  if (!sep) return null;
  return (alleleEffect(g, alleleA) || alleleEffect(g, alleleB)) ? sep.matrix : null;
}

/* ---------------------------------------------------------------------
   COLOUR GRIDS
   Two places in the game combine two genes into one colour, and the value on its own says nothing:
     SKIN  = a flat 16-entry table indexed by SKIN_HUE2 x 4 + SKIN_HUE (lib/renderer/colors.js), so
             the 4x4 grid below IS the whole skin colour space.
     COAT  = baseColours(red, green, brown): BASE_GREEN and BASE_RED pick the branch and BASE_BROWN
             is the third key, so the coat base colour is a 4x4x4 space, shown here as one 4x4 grid
             per BASE_BROWN value.
   Both tables are the literals from the decoder, read out of lib/renderer/colors.js.
   --------------------------------------------------------------------- */
const PALETTE = ['#110b03', '#8a8a8a', '#adafb3', '#c3c6c9', '#eeeeee', '#ffffff', '#d6922c', '#7a3f00',
                 '#d6a660', '#d6cbbc', '#47310f', '#8f3636', '#632626', '#c93c59', '#ffaf40', '#e83a57',
                 '#db7830', '#d8db30', '#a2db30', '#36e345', '#30dbbe', '#30a2db', '#4661e8', '#2200b9',
                 '#7542db', '#2c1852', '#c142db', '#db30a2', '#f0e3a1', '#1c570b', '#ffa799', '#ffc768',
                 '#fdff7d', '#b1ff7d', '#7dff88', '#26ad97', '#95c9bc', '#82d7ff', '#d67c6d', '#b0a207'];
const PAL = i => PALETTE[i];
/* SKIN_TABLE, palette index per (SKIN_HUE2 x 4 + SKIN_HUE) */
const SKIN_TABLE = [30, 9, 8, 31, 38, 1, 17, 14, 11, 10, 39, 7, 25, 36, 5, 37];
/* baseColours(red, green, brown) -> the three coat colours; the sentinel fixup is already applied */
function baseColours(red, green, brown) {
  const S = '@';
  const c = { dark: PAL(6), mid: S, base: S, spot: PAL(9) };
  if (green === 1) {
    if (red === 0 || red === 1) { c.dark = PAL(39); c.mid = PAL(17); c.base = PAL(32); }
    else if (red === 2) { c.spot = PAL(31); c.base = PAL(31); c.dark = PAL(16); }
  } else if (green === 2) {
    if (red === 0) { c.dark = PAL(19); c.spot = PAL(16); c.base = PAL(34); }
    else if (red === 1) { c.dark = PAL(19); c.spot = PAL(17); c.base = PAL(34); }
    else if (red === 2) { c.dark = PAL(18); c.spot = PAL(35); }
  } else if (green === 3) {
    c.dark = PAL(29); c.mid = PAL(19); c.base = PAL(34); c.spot = PAL(39);
  } else {
    if (red === 1) { c.dark = PAL(15); c.base = PAL(30); }
    else if (red === 2) { c.dark = PAL(27); c.spot = PAL(30); c.base = PAL(26); }
    else if (red === 3) { c.spot = PAL(30); c.base = PAL(30); c.dark = PAL(13); c.mid = PAL(38); }
    else if (brown === 1) { c.dark = PAL(7); c.mid = PAL(6); c.base = PAL(8); }
    else if (brown === 2) { c.dark = PAL(10); c.base = PAL(6); c.spot = PAL(8); c.mid = PAL(7); }
    else { c.mid = PAL(8); c.base = PAL(9); }
  }
  if (c.mid === S) c.mid = c.dark;
  if (c.base === S) c.base = c.mid;
  return c;
}
const mod4 = n => ((n % 4) + 4) % 4;

/* What the two swatches of a coat cell are, in the order they are drawn. */
const coatKeyHtml = () =>
  `<p class="grid-key">Each cell: <span class="ctrio">` +
  `<span class="csw"><i>b</i><b style="background:#8a8a8a"></b></span>` +
  `<span class="csw"><i>s</i><b style="background:#8a8a8a"></b></span>` +
  `</span> = <b>b</b>ase coat colour and <b>s</b>pot colour, with BASE_CREAM stepping the base one shade either side. Hover a cell for both.</p>`;

/* A grid of colour swatches: rows x cols, each cell built by cellHtml(value, r, c).
   `marked(r, c)` outlines the cell the gene's own values can produce. */
function colourGrid(title, rowLabel, colLabel, rowVals, colVals, cellHtml, marked) {
  let html = `<h3>${title}</h3><table class="cgrid"><tr><th class="corner">${rowLabel} &darr;<br>${colLabel} &rarr;</th>`;
  for (const c of colVals) html += `<th>${c}</th>`;
  html += '</tr>';
  rowVals.forEach((rv, r) => {
    html += `<tr><th>${rv}</th>`;
    colVals.forEach((cv, c) => {
      html += `<td class="${marked(rv, cv) ? 'hit' : ''}">${cellHtml(rv, cv)}</td>`;
    });
    html += '</tr>';
  });
  return html + '</table>';
}

const swatch = (hex, label, extra) =>
  `<span class="csw" style="background:${hex}"></span>` +
  `<span class="clab">${label}${extra ? `<i>${extra}</i>` : ''}</span>`;

/* The skin grid: the 16 colours of the flat table, as SKIN_HUE2 across and SKIN_HUE down. */
function skinGridHtml(gene) {

  /* the distinct values this gene's four bases give; those are the cells it can reach */
  const reach = new Set([0, 1, 2, 3].map(k => +gvOf(gene, k)));
  return colourGrid(
    'The 16 skin colours: SKIN_HUE2 across, SKIN_HUE down',
    'SKIN_HUE2', 'SKIN_HUE',
    a, a,
    (h2, h) => swatch(PAL(SKIN_TABLE[h2 * 4 + h]), `hue ${h}, hue2 ${h2}`, PAL(SKIN_TABLE[h2 * 4 + h])),
    (h2, h) => (gene.n === 'SKIN_HUE' ? reach.has(h) : reach.has(h2))
  );
}

/* The coat: two grids, because BASE_BROWN only matters while BASE_GREEN is 0 (colors.js:112-128,
   every green branch decides on its own and ignores brown). The BASE_BROWN table therefore holds
   red and green at 0, and the RED/GREEN table holds brown at its default.
   Each cell carries the base coat colour and the spot colour, and the cell tooltip spells both out.
   The base swatch is the BASE_CREAM 0 shade, the darkest of the three steps BASE_CREAM chooses
   between; the two lighter steps are listed in the BASE_CREAM table. */
const CREAM_STEPS = [
  { key: 'base', text: 'above 0.66' },
  { key: 'mid', text: '0.33 to 0.66' },
  { key: 'dark', text: '0.33 and below' },
];
const COAT_TRIO = col =>
  `<span class="ctrio" title="base ${col.dark}  |  spot ${col.spot}">` +
  `<span class="csw"><i>b</i><b style="background:${col.dark}"></b></span>` +
  `<span class="csw"><i>s</i><b style="background:${col.spot}"></b></span>` +
  `</span>`;

function baseBrownGridHtml(gene) {
  const a = [0, 1, 2, 3];
  const reach = new Set(a.map(k => mod4(+gvOf(gene, k))));
  return colourGrid(
    'Coat colours for BASE_BROWN, with BASE_RED and BASE_GREEN at 0 (each cell at BASE_CREAM 0)',
    'BASE_GREEN', 'BASE_BROWN',
    a, a,
    (green, brown) => COAT_TRIO(baseColours(0, green, brown)),
    (green, brown) => gene.n === 'BASE_BROWN' ? reach.has(brown) : true
  );
}

function baseRedGreenGridHtml(gene) {
  const a = [0, 1, 2, 3];
  const reach = new Set(a.map(k => mod4(+gvOf(gene, k))));
  return colourGrid(
    'Coat colours for BASE_GREEN and BASE_RED, with BASE_BROWN at 0 (each cell at BASE_CREAM 0)',
    'BASE_RED', 'BASE_GREEN',
    a, a,
    (red, green) => (red === 0 && green === 0)
      ? `<span class="clab cempty">see the<br>BASE_BROWN table</span>`
      : COAT_TRIO(baseColours(red, green, 0)),
    (red, green) => gene.n === 'BASE_RED' ? reach.has(red)
      : gene.n === 'BASE_GREEN' ? reach.has(green) : true
  );
}

/* BASE_CREAM on its own: the same coat colour at each of the three steps the gene chooses between.
   The ladder is colors.js:158-162; the gene's own values (0, 1, 0, 0 over s 100) only ever reach
   the lowest step, and its dominance of 50 means a heterozygote blends to 0 or 1 as well. */
function creamGridHtml(gene) {
  const a = [0, 1, 2, 3];
  const reach = new Set(a.map(k => +gvOf(gene, k)));
  let html = '<table class="cgrid cram">';
  html += '<tr><th class="corner">BASE_CREAM &darr;<br>colour &rarr;</th>' +
    '<th>Lighter step</th><th>The base colour</th><th>Spot colour</th></tr>';
  for (const step of CREAM_STEPS) {
    const col = baseColours(0, 0, 0);
    /* the step's own colour, and the two the ladder picks between around it */
    const sw = (hex, letter) => `<span class="csw"><i>${letter}</i><b style="background:${hex}"></b></span>`;
    /* does this gene's own four alleles ever reach this step of the ladder? */
    const hit = [...reach].some(v =>
      step.key === 'base' ? v > 0.66 : step.key === 'mid' ? (v > 0.33 && v <= 0.66) : v <= 0.33);
    html += `<tr class="${hit ? 'hit' : ''}"><th>${step.text}<i>${step.key}</i></th>` +
      `<td>${sw(col.mid, 'l')}</td><td>${sw(col[step.key], 'b')}</td><td>${sw(col.spot, 's')}</td></tr>`;
  }
  return html + '</table>';
}
function gvOf(g, allele) { return g.g[allele] / (g.s || 1); }

/* A number for display: integers plain, fractions at most 3 decimals with no trailing zeros. */
function num(v) {
  const r = Math.round(v * 1000) / 1000;
  return Number.isInteger(r) ? String(r) : String(r);
}
const fmtNum = v => Number(num(v)).toLocaleString('en-US', { maximumFractionDigits: 3 });

/* A value from the 4x4 blend, scaled the same way. */
function mvOf(g, value) { return value / (g.s || 1); }

const fmtRaw = v => Number(v).toLocaleString('en-US');

function escAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* One g column: the base it belongs to, the value that base gives (already divided by s), the raw
   column value, and (with Values on) what that number means for a discrete gene. Clicking the cell
   opens the gene's 4x4 matrix with this base's row and column marked. */
function gCellHtml(g, allele) {
  const base = g.o[allele];
  const v = gvOf(g, allele);
  const key = num(v);
  const lab = g.a && g.a.l ? g.a.l[key] : null;
  const swatch = lab && g.a.c && g.a.c[key];
  const chip = (lab && annotationsOn)
    ? `<span class="g-lab">${swatch ? `<i class="sw" style="background:${escAttr(swatch)}"></i>` : ''}${escapeHtml(lab)}</span>` : '';
  const eff = alleleEffect(g, allele);
  const effChip = eff ? `<span class="g-lab g-eff">${escapeHtml(eff)}</span>` : '';
  return `<td class="num g-cell" data-gene="${g.i}" data-allele="${allele}">` +
    `<span class="g-top"><span class="g-base b-${base}">${base}</span><span class="g-val">${fmtNum(v)}</span></span>` +
    chip + effChip + `</td>`;
}

/* ------------------------------ helpers ------------------------------ */
const fmt = n => Number(n).toLocaleString('en-US');

function valueOf(gene, key) {
  if (key === 'hp' || key === 'index') return gene.h * 1000 + gene.p;
  if (key === 'h') return gene.h;
  if (key === 'p') return gene.p;
  if (key === 'n' || key === 'd' || key === 'o') return gene[key].toLowerCase();
  if (key === 'm') return gene.m;
  if (key === 's') return gene.s;
  if (key[0] === 'g') return gvOf(gene, +key[1]);      /* sort by the value the game uses */
  return gene.i;
}

function visibleGenes() {
  const q = query.trim().toLowerCase();
  const words = q ? q.split(/\s+/) : [];
  let list = DATA.genes;
  if (words.length) {
    list = list.filter(g => {
      /* the base order of a gene is searchable too ("ATGC") */
      const hay = (g.n + ' ' + g.d + ' ' + g.h + ':' + g.p + ' ' + g.o).toLowerCase();
      return words.every(w => hay.includes(w));
    });
  }
  const dir = sortDir;
  return list.slice().sort((a, b) => {
    const va = valueOf(a, sortKey), vb = valueOf(b, sortKey);
    let c;
    if (typeof va === 'string') c = va < vb ? -1 : va > vb ? 1 : 0;
    else c = va === vb ? 0 : (va < vb ? -1 : 1);
    /* Equal helix: walk the positions, so a helix always reads P0, P1, P2... */
    if (c === 0 && sortKey === 'h') c = a.p - b.p;
    return c === 0 ? a.i - b.i : c * dir;
  });
}

/* ------------------------------- render ------------------------------ */
function renderHead() {
  const total = COLS.reduce((sum, c) => sum + (colWidth[c.key] || c.w), 0);
  const table = document.getElementById('geneTable');
  table.style.width = `max(100%, ${total}px)`;
  /* A real colgroup keeps header and value the same width, including after a drag. */
  document.getElementById('colGroup').innerHTML = COLS.map(c => {
    const w = colWidth[c.key] || c.w;
    return `<col data-key="${c.key}" style="width:${w}px">`;
  }).join('');
  /* the second sticky column starts where the first one ends */
  document.documentElement.style.setProperty('--helix-w', (colWidth.h || 46) + 'px');

  document.getElementById('headRow').innerHTML = COLS.map(c => {
    const active = sortKey === c.key;
    const arrow = active ? `<span class="arrow">${sortDir > 0 ? '\u25B2' : '\u25BC'}</span>` : '';
    /* every header is right-aligned over its numbers, so header and value line up */
    return `<th class="sortable ${c.cls}" data-key="${c.key}">` +
      `<span class="th-label">${c.label}${arrow}</span><span class="col-resize"></span></th>`;
  }).join('');
}

function renderBody() {
  const rows = visibleGenes();
  const parts = [];
  /* A helix header is drawn the first time that helix appears in the sorted list, and only once:
     the default order is by gene index, so a helix's genes are adjacent but the helix numbers are
     not monotonic (gene 0 lives in helix 6, gene 3 in helix 0). */
  const shownHelix = new Set();
  const helixCount = DATA.genes.reduce((acc, g) => (acc[g.h] = (acc[g.h] || 0) + 1, acc), {});

  for (const g of rows) {
    if (!shownHelix.has(g.h)) {
      shownHelix.add(g.h);
      const count = helixCount[g.h];
      parts.push(`<tr class="helix-group" id="helix-${g.h}"><td colspan="${COLS.length}">` +
        `<span class="g-name">HELIX ${g.h}</span>` +
        `<span class="g-count">${count} gene${count === 1 ? '' : 's'} &middot; P 0-${count - 1}</span></td></tr>`);
    }
    const rowClass = (g.h % 2 === 0 ? 'helix-even' : 'helix-odd');
    /* a dot after a name means the gene carries a note, which the modal shows */
    const mark = hasAnn(g) && g.a.t ? `<sup class="ann-mark">\u00b7</sup>` : '';
    parts.push(
      `<tr class="${rowClass}" id="${geneId(g)}">` +
`<td class="c-helix">${g.h}</td>` +
`<td class="c-pos">${g.p}</td>` +
`<td class="name"><a href="${hashFor(g)}" data-gene="${g.i}">${g.n}</a>${mark}</td>` +
`<td class="m num"><button data-gene="${g.i}">${g.m}</button></td>` +
`<td class="num">${g.s}</td>` +
g.g.map((v, a) => gCellHtml(g, a)).join('') +
`<td class="desc">${g.d}</td>` +
`</tr>`);
  }

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = parts.length ? parts.join('') : '';
  document.getElementById('count').innerHTML =
    `<b>${rows.length}</b> of ${DATA.genes.length} genes` + (query ? ` matching "${escapeHtml(query)}"` : '');
  document.getElementById('clearSearch').style.display = query ? 'block' : 'none';
  if (!parts.length) {
    tbody.innerHTML = `<tr><td colspan="${COLS.length}" class="no-results">No gene matches "${escapeHtml(query)}".</td></tr>`;
  }
  flashTarget();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* A gene's link and row id is its own name: #SIZE, #TAIL_SHAPE. The name is URL-safe as it stands
   (capital letters and underscores), so the address bar reads plainly. */
function geneId(g) { return g.n; }
const byName = new Map(DATA.genes.map(g => [g.n.toLowerCase(), g]));
function geneFromHash(hash) {
  const raw = decodeURIComponent(String(hash || '').replace(/^#/, '')).trim();
  return raw ? byName.get(raw.toLowerCase()) || null : null;
}
function hashFor(g) { return '#' + geneId(g); }
function clearHash() {
  history.replaceState(null, '', location.pathname + location.search);
}

function flashTarget() {
  const g = geneFromHash(location.hash);
  if (!g) return;
  const tr = document.getElementById(geneId(g));
  if (!tr) return;
  tr.scrollIntoView({ block: 'center' });
  tr.classList.add('flash');
  setTimeout(() => tr.classList.remove('flash'), 1800);
}

/* ---------------------------- matrix modal --------------------------- */
let modalGene = null;

function hexToRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
/* Background for a cell: zero is flat grey, positives ramp to blue and negatives to red, each
   against the gene's own smallest and largest magnitude so every gene reads at a glance. The colour
   stays on the cell so it cannot tint the number drawn over it. */
function cellStyle(v, min, max) {
  if (v === 0) return 'background:#2a3644';
  const neg = v < 0;
  const span = neg ? Math.abs(Math.min(0, min)) : Math.max(0, max);
  const t = span === 0 ? 0.6 : Math.min(1, Math.abs(v) / span);
  const base = neg ? [90, 40, 32] : [26, 44, 66];
  const peak = neg ? [214, 78, 60] : hexToRgb('#3f8fd8');
  const f = 0.15 + 0.85 * t;
  const out = base.map((c, i) => Math.round(c + (peak[i] - c) * f));
  return `background:rgb(${out[0]},${out[1]},${out[2]})`;
}

/* One axis label of the 4x4 grid: the base, and the effect that base brings where there is one. */
function matrixAxisHtml(g, bases, base) {
  const eff = axisEffect(g, bases.indexOf(base));
  return `<th class="aa-${base}">${base}${eff ? `<i class="eff">${escapeHtml(eff)}</i>` : ''}</th>`;
}

function openMatrix(i, push, markAllele) {
  const g = DATA.genes[i];
  if (!g) return;
  modalGene = g;
  const bases = g.o.split('');
  /* The display value is the blend divided by s, like the table: SIZE 100 is 1.0. */
  const scaled = MAT[g.x].map(v => mvOf(g, v));
  const min = Math.min.apply(null, scaled), max = Math.max.apply(null, scaled);

  document.getElementById('modalTitle').textContent = g.n;
  document.getElementById('modalMeta').innerHTML =
    `H:P <b>${g.h}:${g.p}</b> &middot; gene <b>#${g.i}</b> &middot; dominance m <b>${g.m}</b> &middot; scale s <b>${g.s}</b>` +
    ` &middot; n <b>${g.o}</b> (first = most dominant) &middot; raw g <b>${g.g.join(' / ')}</b>` +
    (g.s === 1 ? '' : ` &middot; values shown as <b>g / s</b> (raw / ${g.s})`);
  document.getElementById('modalDesc').textContent = g.d;

  /* What the values mean: the discrete names for this gene, then the caveat that comes with it. */
  const ann = g.a;
  const labels = ann && ann.l ? ann.l : null;
  let annHtml = '';
  if (labels) {
    annHtml += `<h3>${ann.c ? 'The colour each value gives' : 'What the value means'}</h3><div class="m-strip">` +
      Object.keys(labels).map(k => {
        const sw = ann.c && ann.c[k] ? `<i class="sw" style="background:${escAttr(ann.c[k])}"></i>` : '';
        const on = scaled.some(v => num(v) === k);
        /* A colour gene's name for a value IS the colour, so the swatch and the number say it all:
           printing the name too just repeats the number (SKIN_HUE's names are "0", "1", "2", "3"). */
        const name = ann.c ? '' : ` ${escapeHtml(labels[k])}`;
        return `<span class="chip${on ? ' on' : ''}"${name ? '' : ` title="${escAttr(labels[k])}"`}>${sw}<b>${escapeHtml(k)}</b>${name}</span>`;
      }).join('') + '</div>';
  }
  if (ann && ann.t) annHtml += `<p class="ann-note"><b>Note:</b> ${escapeHtml(ann.t)}</p>`;
  document.getElementById('modalAnn').innerHTML = annHtml;

  /* The genes whose meaning is a colour decided together with another gene get the whole grid. */
  const gridHost = document.getElementById('gridHost');
  if (g.n === 'SKIN_HUE' || g.n === 'SKIN_HUE2') {
    gridHost.innerHTML = skinGridHtml(g) +
      `<p class="grid-note">SKIN_HUE and SKIN_HUE2 are the two halves of one number: the colour is read from a flat table of 16 at <code>SKIN_HUE2 x 4 + SKIN_HUE</code>, so the value of either gene on its own is only half the answer. The outlined cells are the ones this gene's own values reach (a heterozygote can also let the game take the higher of the two strands instead of the lower, which is why two genes matter and not one).</p>`;
  } else if (g.n === 'BASE_BROWN') {
    gridHost.innerHTML = baseBrownGridHtml(g) +
      coatKeyHtml() +
      `<p class="grid-note">BASE_BROWN only changes the coat while BASE_GREEN is 0: every green branch of the colour code decides on its own and never looks at brown (colors.js:112-128). This table is therefore brown against green with BASE_RED at 0, and each cell is the coat at BASE_CREAM 0.</p>`;
  } else if (g.n === 'BASE_RED' || g.n === 'BASE_GREEN') {
    gridHost.innerHTML = baseRedGreenGridHtml(g) +
      coatKeyHtml() +
      `<p class="grid-note">BASE_GREEN and BASE_RED pick the coat between them. The corner where both are 0 is the brown side of the code, so it is left empty and shown in the BASE_BROWN table instead. To see brown's own effect, open BASE_BROWN.</p>`;
  } else if (g.n === 'BASE_CREAM') {
    gridHost.innerHTML = creamGridHtml(g) +
      `<p class="grid-note">BASE_CREAM does not change the hue: it picks which of three shades of the same coat colour is used for the base. Above 0.66 the lightest stands, 0.33 to 0.66 the middle one, and below that the darkest, which is the shade the other coat tables show (colors.js:158-162).</p>`;
  } else {
    gridHost.innerHTML = '';
  }

  /* A cell shows the name of its value, and the effect the base itself brings where one applies. */
  const labelFor = v => (labels && labels[num(v)] ? labels[num(v)] : null);
  let html = '<table class="matrix"><tr><th class="corner"></th>';
  for (const b of bases) html += matrixAxisHtml(g, bases, b);
  html += '</tr>';
  for (let a = 0; a < 4; a++) {
    html += '<tr>' + matrixAxisHtml(g, bases, bases[a]);
    for (let b = 0; b < 4; b++) {
      const v = scaled[a * 4 + b];
      const lab = labelFor(v);
      /* an effect that comes from carrying the base, in either strand, anywhere in the pair */
      const eff = matrixEffectFor(g, a, b);
      /* the base pair the user clicked in the table, so the modal opens where they were */
      const hit = markAllele !== undefined && (a === markAllele || b === markAllele);
      const small = (lab || eff)
        ? `<small>${lab ? `<b>${escapeHtml(lab)}</b>` : ''}${lab && eff ? ' ' : ''}${eff ? `<i class="eff">${escapeHtml(eff)}</i>` : ''}</small>`
        : '';
      html += `<td class="${a === b ? 'diag' : ''}${hit ? ' hit' : ''}" style="${cellStyle(v, min, max)}">` +
        `<span class="mnum">${fmtNum(v)}</span>${small}</td>`;
    }
    html += '</tr>';
  }
  html += '</table>';
  document.getElementById('matrixHost').innerHTML = html;

  /* no legend under the matrix: the axes are labelled on the table itself */
  document.getElementById('matrixNote').innerHTML = '';

  document.getElementById('modalBg').classList.add('open');
  document.getElementById('copyLink').textContent = 'Copy link';
  if (push) history.replaceState(null, '', hashFor(g));
}

function closeMatrix() {
  document.getElementById('modalBg').classList.remove('open');
  modalGene = null;
  clearHash();          /* closing the gene leaves a clean address bar */
}

/* ------------------------------ events ------------------------------- */
/* Which direction a column sorts in when it is picked for the first time. Text reads
   best A->Z, but sizes, dominance and gene values are far more useful biggest-first. */
const FIRST_DIR = { index: 1, h: 1, p: 1, n: 1, d: 1, o: 1, m: -1, s: -1, g0: -1, g1: -1, g2: -1, g3: -1 };

document.getElementById('headRow').addEventListener('click', e => {
  if (e.target.closest('.col-resize')) return;      /* that edge drags, it does not sort */
  const th = e.target.closest('th.sortable');
  if (!th) return;
  const key = th.dataset.key;
  if (sortKey === key) sortDir = -sortDir;
  else { sortKey = key; sortDir = FIRST_DIR[key] || 1; }
  renderHead(); renderBody();
  window.scrollTo({ top: 0 });
});

/* Drag a header edge to widen or narrow that column (double-click the edge to fit the header).
   Widths are kept per column, in CSS px, and remembered in localStorage. */
(function columnResizer() {
  const MIN = 34;
  const headRow = document.getElementById('headRow');
  const table = document.getElementById('geneTable');
  let key = null, startX = 0, startW = 0;

  const widthOf = k => {
    const col = document.querySelector(`colgroup col[data-key="${k}"]`);
    if (col) return col.getBoundingClientRect().width;
    return (colWidth[k] || (COLS.find(c => c.key === k) || {}).w || 80);
  };

  const onMove = e => {
    if (!key) return;
    /* keep the table from squeezing below the sum of the widths */
    const w = Math.max(MIN, Math.round(startW + (e.clientX - startX)));
    colWidth[key] = w;
    const col = document.querySelector(`colgroup col[data-key="${key}"]`);
    if (col) col.style.width = w + 'px';
    const total = COLS.reduce((sum, c) => sum + (colWidth[c.key] || c.w), 0);
    table.style.width = `max(100%, ${total}px)`;
    e.preventDefault();
  };
  const onUp = () => {
    if (!key) return;
    key = null;
    document.body.classList.remove('col-resizing');
    document.querySelectorAll('.col-resize.active').forEach(el => el.classList.remove('active'));
    saveColWidths();
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
  };

  headRow.addEventListener('mousedown', e => {
    const grip = e.target.closest('.col-resize');
    if (!grip) return;
    const th = grip.closest('th');
    key = th.dataset.key;
    startX = e.clientX;
    startW = widthOf(key);
    grip.classList.add('active');
    document.body.classList.add('col-resizing');
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    e.preventDefault();
    e.stopPropagation();
  });
  headRow.addEventListener('dblclick', e => {
    const grip = e.target.closest('.col-resize');
    if (!grip) return;
    const k = grip.closest('th').dataset.key;
    /* fit the widest cell in that column, within reason */
    delete colWidth[k];
    renderHead(); renderBody();
    saveColWidths();
  });
}());

document.getElementById('tbody').addEventListener('click', e => {
  const cell = e.target.closest('td.g-cell');
  if (cell) { openMatrix(+cell.dataset.gene, true, +cell.dataset.allele); return; }
  const btn = e.target.closest('button[data-gene]');
  if (btn) { openMatrix(+btn.dataset.gene, true); return; }
  const link = e.target.closest('a[data-gene]');
  if (link) {
    const i = +link.dataset.gene;
    /* left-click: select + copy the direct link, keep the page where it is */
    e.preventDefault();
    openMatrix(i, true);
    copyText(location.href);
    document.getElementById('copyLink').textContent = 'Copied!';
    return;
  }
  const hg = e.target.closest('td.c-helix');
  if (hg) {
    const h = hg.textContent.trim();
    const row = document.getElementById('g-' + DATA.genes.find(g => String(g.h) === h).i);
    if (row) { row.scrollIntoView({ block: 'center' }); row.classList.add('flash'); setTimeout(() => row.classList.remove('flash'), 1500); }
  }
});

function copyText(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).catch(() => fallbackCopy(t));
  } else fallbackCopy(t);
}
function fallbackCopy(t) {
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}

const search = document.getElementById('search');
let debounce = null;
search.addEventListener('input', () => {
  clearTimeout(debounce);
  debounce = setTimeout(() => { query = search.value; renderBody(); }, 90);
});
search.addEventListener('keydown', e => {
  if (e.key === 'Escape') { search.value = ''; query = ''; renderBody(); }
  if (e.key === 'Enter') {
    const first = document.querySelector('#tbody tr[data-i]');
    if (first) { first.scrollIntoView({ block: 'center' }); first.classList.add('flash'); setTimeout(() => first.classList.remove('flash'), 1500); }
  }
});
document.getElementById('clearSearch').addEventListener('click', () => {
  search.value = ''; query = ''; renderBody(); search.focus();
});
document.getElementById('resetBtn').addEventListener('click', () => {
  search.value = ''; query = ''; sortKey = 'h'; sortDir = 1;
  colWidth = {}; saveColWidths();       /* column widths back to their defaults too */
  clearHash();                          /* and no gene left linked in the address bar */
  renderHead(); renderBody();
});

document.getElementById('closeModal').addEventListener('click', closeMatrix);
document.getElementById('modalBg').addEventListener('click', e => { if (e.target.id === 'modalBg') closeMatrix(); });
document.getElementById('copyLink').addEventListener('click', () => {
  if (!modalGene) return;
  copyText(location.origin + location.pathname + location.search + hashFor(modalGene));
  document.getElementById('copyLink').textContent = 'Copied!';
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('modalBg').classList.contains('open')) closeMatrix();
  }
  if (e.key === '/' && document.activeElement !== search) { e.preventDefault(); search.focus(); }
});

/* ------------------------------- start ------------------------------- */
renderHead();
renderBody();
/* An incoming #GENE_NAME link opens that gene; a link to a plain row just flashes it. */
if (location.hash) {
  const g = geneFromHash(location.hash);
  if (g) openMatrix(g.i, false);
}
window.addEventListener('hashchange', () => {
  const g = geneFromHash(location.hash);
  if (g) { openMatrix(g.i, false); return; }
  if (document.getElementById('modalBg').classList.contains('open')) closeMatrix();
});
</script>
</body>
</html>
